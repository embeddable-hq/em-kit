<!doctype html>

<html><head><meta charset="utf-8"><style>

  .url{position:absolute;left:96px;bottom:56px;font-size:26px;color:#6d28d9;font-weight:600}

<rect fill="#18181b" x="4" y="17" width="6.5" height="11" rx="2.5"/><rect fill="url(#g)" x="12.75" y="4" width="6.5" height="24" rx="2.5"/><rect fill="#18181b" x="21.5" y="12" width="6.5" height="16" rx="2.5"/></svg>
